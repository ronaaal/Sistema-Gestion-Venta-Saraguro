<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Artesanías Saraguro</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #fafafa; }
        h1 { color: #333; }
        .mensaje { padding: 15px; background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; margin-bottom: 20px; }
        .tarjeta { border: 1px solid #ddd; background: white; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .info strong { font-size: 1.2em; color: #2c3e50; }
        .precio { color: #e67e22; font-weight: bold; }
        button { background: #27ae60; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <h1>Sistema de Ventas - Pueblo Saraguro 👒</h1>
    
    {% if mensaje %}
        <div class="mensaje">{{ mensaje }}</div>
    {% endif %}

    <h2>Catálogo de Productos</h2>
    
    {% for p in productos %}
    <div class="tarjeta">
        <div class="info">
            <strong>{{ p.nombre }}</strong> <br>
            <small>Artesana: {{ p.artesana }} | Tipo: {{ p.tipo }}</small> <br>
            <span class="precio">${{ p.precio }}</span> | Stock: {{ p.stock }}
        </div>
        
        {% if p.stock > 0 %}
        <form action="/comprar" method="POST">
            <input type="hidden" name="id" value="{{ p.id }}">
            <input type="number" name="cantidad" value="1" min="1" max="{{ p.stock }}" style="width: 40px;">
            <button type="submit">Comprar</button>
        </form>
        {% else %}
        <button disabled style="background: grey;">Agotado</button>
        {% endif %}
    </div>
    {% endfor %}
</body>
</html>
